# Mouse/touch support
set -g mouse on

# More history for logs / Codex output
set -g history-limit 50000

# Start numbering windows/panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows after closing one
set -g renumber-windows on

# Faster ESC response (useful for terminal editors)
set -sg escape-time 10

# Better terminal capabilities
set -g default-terminal "tmux-256color"

# Keep windows around if a command exits
set -g remain-on-exit off
